<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkbox</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f6f7f4; --card:#fff; --ink:#1f2a24; --mute:#68746c; --brand:#2f6f4f; --brand2:#e9f2ec; --line:#dfe4de; --warn:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { background:var(--brand); color:#fff; padding:10px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  nav button { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); padding:6px 14px; border-radius:20px; cursor:pointer; font-size:14px; }
  nav button.active { background:#fff; color:var(--brand); }
  main { flex:1; display:flex; min-height:0; }
  #side { width:420px; max-width:45vw; display:flex; flex-direction:column; background:var(--card); border-right:1px solid var(--line); min-height:0; }
  #mapwrap { flex:1; position:relative; min-width:0; }
  #map { position:absolute; inset:0; }
  #livebar { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:900; background:#fff; border-radius:20px; padding:6px 14px; font-size:13px; box-shadow:0 1px 6px rgba(0,0,0,.3); display:none; max-width:90%; text-align:center; }
  #livebar.ok { color:var(--brand); } #livebar.off { color:var(--warn); }
  #elev { position:absolute; left:12px; right:12px; bottom:22px; z-index:900; background:#fff; border-radius:18px; box-shadow:0 2px 10px rgba(0,0,0,.3); padding:8px 12px 4px; display:none; touch-action:none; }
  #elev .elx { position:absolute; top:-12px; right:-4px; width:28px; height:28px; line-height:24px; border:0; border-radius:50%; background:#fff; box-shadow:0 1px 5px rgba(0,0,0,.4); font-size:20px; cursor:pointer; color:#444; z-index:2; padding:0; }
  #elev .cap { font-size:10px; color:var(--mute); }
  #elev svg { display:block; }
  .me { width:22px; height:22px; border-radius:50%; background:#1a73e8; border:3px solid #fff; box-shadow:0 0 0 2px rgba(26,115,232,.35), 0 1px 4px rgba(0,0,0,.5); box-sizing:border-box; }
  #info { position:absolute; left:12px; top:84px; width:272px; max-height:calc(100% - 290px); overflow:auto; z-index:900; background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.3); font-size:13px; display:none; }
  #info .ih { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; cursor:pointer; font-weight:600; user-select:none; }
  #info .ib { padding:0 12px 10px; }
  #info .wnow { font-size:15px; font-weight:600; margin-bottom:2px; }
  #info .day { display:flex; justify-content:space-between; gap:6px; padding:3px 0; border-top:1px solid var(--line); }
  #info .sub { color:var(--mute); font-size:12px; }
  #info .chips2 { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 4px; }
  #info .chips2 button { border:1px solid var(--line); background:#fff; border-radius:16px; padding:3px 9px; cursor:pointer; font-size:13px; }
  #info .chips2 button.on { background:var(--brand2); border-color:var(--brand); color:var(--brand); font-weight:600; }
  #info .chips2 button:disabled { opacity:.4; cursor:default; }
  #info .pl { padding:4px 0; border-top:1px solid var(--line); cursor:pointer; }
  #info .sec { font-weight:600; margin-top:8px; }
  .poi { width:24px; height:24px; border-radius:50%; background:#fff; border:2px solid #555; text-align:center; line-height:19px; font-size:13px; box-sizing:border-box; }
  @media (max-width:800px) { #info { width:calc(100% - 24px); max-height:38%; } }
  #revbtn { position:absolute; top:10px; right:12px; z-index:900; display:none; background:#fff; border:0; border-radius:20px; padding:7px 14px; font-size:13px; font-weight:600; color:var(--brand); box-shadow:0 1px 6px rgba(0,0,0,.3); cursor:pointer; }
  #revbtn.on { background:var(--brand); color:#fff; }
  .arr { width:18px; height:18px; border-radius:50%; background:#fff; border:2px solid #1b5e20; color:#1b5e20; font-size:9px; line-height:14px; text-align:center; box-sizing:border-box; }
  .pin { width:20px; height:20px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 3px rgba(0,0,0,.6); box-sizing:border-box; }
  .pin.start { background:linear-gradient(90deg,#1b5e20 50%,#222 50%); }
  .pin.end { background:#222; color:#fff; font-size:11px; line-height:14px; text-align:center; }
  .tools { padding:10px; border-bottom:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .tools input[type=text], .tools input[type=number], .tools select { padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  .tools input[type=text] { flex:1; min-width:120px; }
  .tools input[type=number] { width:70px; }
  button.b { background:var(--brand); color:#fff; border:0; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:14px; }
  button.b.alt { background:var(--brand2); color:var(--brand); }
  button.b:disabled { opacity:.5; cursor:default; }
  #status { padding:8px 12px; font-size:13px; color:var(--mute); border-bottom:1px solid var(--line); min-height:34px; }
  #status.err { color:var(--warn); }
  #list { overflow:auto; flex:1; }
  .item { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; gap:10px; cursor:pointer; }
  .item:hover, .item.sel { background:var(--brand2); }
  .item .t { font-weight:600; }
  .item .m { font-size:13px; color:var(--mute); }
  .item .d { font-size:13px; margin-top:2px; }
  .src { font-size:13px; color:var(--mute); display:flex; align-items:center; gap:4px; }
  .chip { display:inline-block; font-size:12px; background:var(--brand2); color:var(--brand); padding:1px 8px; border-radius:10px; margin:2px 4px 0 0; }
  .chip.warn { background:#fdecea; color:var(--warn); }
  .gpanel { margin-top:8px; padding:8px; background:#fafbf9; border:1px solid var(--line); border-radius:8px; font-size:13px; cursor:default; }
  .gpanel .ph { display:flex; gap:8px; overflow-x:auto; margin:6px 0; }
  .gpanel .ph figure { margin:0; flex:none; width:170px; }
  .gpanel .ph img { width:170px; height:110px; object-fit:cover; border-radius:6px; display:block; }
  .gpanel figcaption { font-size:11px; color:var(--mute); line-height:1.3; margin-top:2px; }
  .gpanel .stars span { font-size:22px; cursor:pointer; color:#c9d3cc; }
  .gpanel .stars span.on { color:#e0a100; }
  .gpanel textarea { width:100%; min-height:60px; padding:6px; border:1px solid var(--line); border-radius:6px; font:inherit; resize:vertical; }
  .gpanel .att { font-size:11px; color:var(--mute); margin-top:4px; }
  .navp { margin-top:6px; padding:8px; background:#f1f6f3; border:1px solid var(--line); border-radius:8px; font-size:13px; cursor:default; }
  .navp a, .navp button { display:inline-block; margin:2px 6px 2px 0; }
  .navp .live { margin-top:4px; font-weight:600; }
  .steps { margin:6px 0 0; padding-left:20px; font-size:13px; }
  .steps li { margin:3px 0; cursor:pointer; }
  .steps li small { color:var(--mute); }
  .badge { font-size:11px; background:var(--brand2); color:var(--brand); padding:1px 7px; border-radius:10px; margin-left:6px; }
  .acts { display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
  .acts a, .acts button { font-size:13px; }
  a.dl { background:var(--brand); color:#fff; padding:5px 10px; border-radius:6px; text-decoration:none; white-space:nowrap; }
  button.del { background:none; border:0; color:var(--warn); cursor:pointer; padding:0; }
  .foot { padding:6px 10px; font-size:11px; color:var(--mute); border-top:1px solid var(--line); }
  @media (max-width:800px) { main { flex-direction:column-reverse; } #side { width:100%; max-width:none; height:55vh; } #mapwrap { height:45vh; flex:none; } }
</style>
</head>
<body>
<header>
  <h1>🥾 Walkbox</h1>
  <nav>
    <button id="tabFind" class="active">Find walks</button>
    <button id="tabBox">My walk box</button>
  </nav>
</header>
<main>
  <section id="side">
    <div id="findTools" class="tools">
      <input type="text" id="place" placeholder="Go to a place, e.g. Queenstown">
      <button class="b alt" id="goBtn">Go</button>
      <button class="b" id="searchBtn" style="width:100%">Find walks in this map view</button>
      <label class="src"><input type="checkbox" id="srcDoc" checked> DOC tracks (NZ)</label>
      <label class="src"><input type="checkbox" id="srcNz" checked> NZ council tracks</label>
      <label class="src"><input type="checkbox" id="srcRoutes" checked> Official routes</label>
      <label class="src"><input type="checkbox" id="srcPaths" checked> Named paths</label>
    </div>
    <div id="boxTools" class="tools" style="display:none">
      <input type="text" id="q" placeholder="Search your walks (name, place, operator…)">
      <input type="number" id="minKm" placeholder="min km" min="0" step="0.5">
      <input type="number" id="maxKm" placeholder="max km" min="0" step="0.5">
      <select id="sort">
        <option value="added">Newest added</option>
        <option value="name">Name A–Z</option>
        <option value="longest">Longest</option>
        <option value="shortest">Shortest</option>
      </select>
      <button class="b alt" id="zipBtn">Download all (.zip)</button>
      <button class="b alt" id="importBtn">Import GPX</button>
      <input type="file" id="importFile" accept=".gpx,application/gpx+xml" multiple style="display:none">
    </div>
    <div id="findActions" class="tools" style="display:none">
      <button class="b" id="addSelBtn">Add selected to my box</button>
      <button class="b alt" id="selAllBtn">Select all</button>
    </div>
    <div id="status">Finding your location…</div>
    <div id="list"></div>
    <div class="foot">Route data © OpenStreetMap contributors (ODbL). Check conditions before you walk.</div>
  </section>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="livebar"></div>
    <div id="elev"></div>
    <div id="info"></div>
    <button id="revbtn" title="Walk it the other way round: the start and end swap places">⇄ Swap start / end</button>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const MAX_SPAN = {{ max_span }};
const ROUTING = {{ 'true' if routing_enabled else 'false' }};
let mode = 'find';
let results = [];
const selected = new Set();
const AUCKLAND_CBD = [-36.8485, 174.7633];
const map = L.map('map').setView(AUCKLAND_CBD, 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '© OpenStreetMap contributors'
}).addTo(map);
const layerGroup = L.layerGroup().addTo(map);
let lines = {};

const $ = id => document.getElementById(id);
function status(msg, err) { const s = $('status'); s.textContent = msg; s.className = err ? 'err' : ''; }

function setMode(m) {
  mode = m; if (typeof clearSelection === 'function') clearSelection(); if (typeof clearRoute === 'function') clearRoute();
  $('tabFind').classList.toggle('active', m === 'find');
  $('tabBox').classList.toggle('active', m === 'box');
  $('findTools').style.display = m === 'find' ? '' : 'none';
  $('findActions').style.display = m === 'find' && results.length ? '' : 'none';
  $('boxTools').style.display = m === 'box' ? '' : 'none';
  results = []; selected.clear(); render(); layerGroup.clearLayers();
  if (m === 'box') loadBox(); else status('Move the map to an area, then press “Find walks in this map view”.');
}
$('tabFind').onclick = () => setMode('find');
$('tabBox').onclick = () => setMode('box');

async function post(url, body, signal) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body), signal});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('Request failed (' + r.status + ')'));
  return j;
}

// ---- Go to place (Nominatim, from the browser) ----
async function goPlace() {
  const q = $('place').value.trim(); if (!q) return;
  status('Looking up place…');
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    const j = await r.json();
    if (!j.length) { status('Place not found.', true); return; }
    const bb = j[0].boundingbox.map(Number); // s, n, w, e
    map.fitBounds([[bb[0], bb[2]], [bb[1], bb[3]]], {maxZoom: 13, animate: false});
    window._place = j[0].display_name.split(',').slice(0, 2).join(',').trim();
    status('Moved to ' + j[0].display_name + '. Searching…');
    runSearch();
  } catch (e) { status('Place lookup failed: ' + e.message, true); }
}
$('goBtn').onclick = goPlace;
$('place').addEventListener('keydown', e => { if (e.key === 'Enter') goPlace(); });

// ---- Find ----
let searchCtl = null, searchSeq = 0;
const SOURCE_ORDER = ['doc', 'nz-track', 'osm-route', 'osm-path'];
function mergeResults(bySource) {   // keep routes already loaded, drop duplicates of the same name from less curated sources
  const old = new Map(results.map(r => [r.osm_id, r]));
  const out = [];
  Object.values(bySource).forEach(list => list.forEach(r => out.push(old.get(r.osm_id) || r)));
  const names = src => new Set(out.filter(r => r.source === src).map(r => r.name.toLowerCase()));
  const doc = names('doc');
  let merged = out.filter(r => !(r.source === 'nz-track' && doc.has(r.name.toLowerCase())));
  const cur = new Set(merged.filter(r => r.source === 'doc' || r.source === 'nz-track').map(r => r.name.toLowerCase()));
  merged = merged.filter(r => !(r.source === 'osm-path' && cur.has(r.name.toLowerCase())));
  merged.sort((a, b) => (SOURCE_ORDER.indexOf(a.source) - SOURCE_ORDER.indexOf(b.source)) || ((b.distance_km || 0) - (a.distance_km || 0)));
  return merged;
}
async function runSearch() {
  const b = map.getBounds();
  if ((b.getNorth() - b.getSouth()) > MAX_SPAN || (b.getEast() - b.getWest()) > MAX_SPAN) {
    status('Zoom in a bit: the map view is too large to search.', true); return;
  }
  if (searchCtl) searchCtl.abort();          // a new search replaces the one in progress
  searchCtl = new AbortController();
  const mine = ++searchSeq, btn = $('searchBtn'), signal = searchCtl.signal;
  const want = [['doc', 'DOC', 'srcDoc'], ['nz', 'Councils', 'srcNz'], ['routes', 'Routes', 'srcRoutes'], ['paths', 'Paths', 'srcPaths']].filter(x => $(x[2]).checked);
  if (!want.length) { status('Tick at least one source.', true); return; }
  btn.textContent = 'Searching… (press again to restart)';
  results = []; selected.clear(); render();      // a new search starts from an empty list
  const state = {}, bySource = {}, warnings = [];
  want.forEach(x => state[x[0]] = '…');
  const show = done => status((done ? 'Done. ' : 'Searching: ') + want.map(x => x[1] + ' ' + state[x[0]]).join(' · ') + (done ? '' : ' (results appear as each source answers)'));
  show(false);
  let capped = false;
  await Promise.all(want.map(async ([key, label]) => {
    try {
      const j = await post('/api/search', {south:b.getSouth(), west:b.getWest(), north:b.getNorth(), east:b.getEast(), sources: [key]}, signal);
      if (mine !== searchSeq) return;
      bySource[key] = j.results; capped = capped || j.capped; (j.warnings || []).forEach(w => warnings.push(w));
      state[key] = '✓ ' + j.results.length + (j.ms ? ' (' + (j.ms / 1000).toFixed(1) + ' s)' : '');
    } catch (e) {
      if (e.name === 'AbortError' || mine !== searchSeq) return;
      state[key] = '✗'; warnings.push(label + ': ' + e.message);
    }
    if (mine !== searchSeq) return;
    results = mergeResults(bySource); render(true); show(false);
    $('findActions').style.display = results.length ? '' : 'none';
  }));
  if (mine !== searchSeq) return;
  btn.textContent = 'Find walks in this map view';
  const warn = warnings.length ? ' Note: ' + warnings.join(' | ') : '';
  show(true);
  status($('status').textContent + ' ' + (results.length ? results.length + ' walks' + (capped ? ' (list capped, zoom in for more)' : '') + '. Click a walk to load its route.' : 'No walks found here. Try another area or turn on more sources.') + warn, !!warn && !results.length);
}
$('searchBtn').onclick = runSearch;

$('selAllBtn').onclick = () => { results.filter(r => !r.added).forEach(r => selected.add(r.osm_id)); render(); };
$('addSelBtn').onclick = async () => {
  if (!selected.size) { status('Tick the walks you want first.', true); return; }
  $('addSelBtn').disabled = true; status('Adding…');
  try {
    const j = await post('/api/walks', {ids:[...selected], place: window._place || null});
    results.forEach(r => { if (selected.has(r.osm_id)) r.added = true; });
    selected.clear(); render();
    status(j.added + ' walk(s) added to your box. Open “My walk box” to download them.');
  } catch (e) { status(e.message, true); }
  $('addSelBtn').disabled = false;
};

// ---- Box ----
async function loadBox() {
  const p = new URLSearchParams({q:$('q').value, sort:$('sort').value});
  if ($('minKm').value) p.set('min_km', $('minKm').value);
  if ($('maxKm').value) p.set('max_km', $('maxKm').value);
  try {
    const r = await fetch('/api/library?' + p); const j = await r.json();
    results = j.results; render();
    status(results.length + ' walk(s) in your box.');
    $('zipBtn').disabled = !results.length;
  } catch (e) { status('Could not load the box: ' + e.message, true); }
}
let t; ['q','minKm','maxKm','sort'].forEach(id => $(id).addEventListener('input', () => { clearTimeout(t); t = setTimeout(loadBox, 250); }));
$('zipBtn').onclick = () => { location.href = '/walks.zip?ids=' + results.map(r => r.osm_id).join(','); };

$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async () => {
  const files = [...$('importFile').files]; if (!files.length) return;
  const fd = new FormData(); files.forEach(f => fd.append('files', f));
  status('Importing ' + files.length + ' file(s)…');
  try {
    const r = await fetch('/api/import', {method:'POST', body: fd});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('Import failed (' + r.status + ')'));
    await loadBox();
    const bad = j.errors && j.errors.length ? ' Problems: ' + j.errors.join(' | ') : '';
    status(j.added + ' walk(s) imported' + (j.skipped ? ', ' + j.skipped + ' already in your box' : '') + '.' + bad, !!bad && !j.added);
  } catch (e) { status(e.message, true); }
  $('importFile').value = '';
};

// BEGIN NAV
function fmtPt(p) { return p[0].toFixed(6) + ',' + p[1].toFixed(6); }
function navLinks(r) {
  const chain = r.line[0], s = chain[0], e = chain[chain.length - 1];
  const mid = [], n = Math.min(8, Math.max(0, chain.length - 2));
  for (let i = 1; i <= n; i++) mid.push(chain[Math.round(i * (chain.length - 1) / (n + 1))]);
  const base = 'https://www.google.com/maps/dir/?api=1';
  return {
    toStart: base + '&destination=' + fmtPt(s),
    walk: base + '&origin=' + fmtPt(s) + '&destination=' + fmtPt(e) +
          (mid.length ? '&waypoints=' + encodeURIComponent(mid.map(fmtPt).join('|')) : '') + '&travelmode=walking',
    apple: 'https://maps.apple.com/?daddr=' + fmtPt(s) + '&dirflg=w',
    geo: 'geo:' + fmtPt(s) + '?q=' + fmtPt(s) + '(' + encodeURIComponent(r.name) + ')',
    omShow: 'om://map?v=1&ll=' + fmtPt(s) + '&n=' + encodeURIComponent(r.name) + '&appname=Walkbox',
    omRoute: 'om://route?v=1&sll=' + fmtPt(s) + '&saddr=' + encodeURIComponent('Start') +
             '&dll=' + fmtPt(e) + '&daddr=' + encodeURIComponent(r.name) + '&type=pedestrian&appname=Walkbox'
  };
}
function havM(a, b) {
  const R = 6371008.8, rad = x => x * Math.PI / 180;
  const dLa = rad(b[0] - a[0]), dLo = rad(b[1] - a[1]);
  const q = Math.sin(dLa / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(q));
}
function distToRoute(lat, lon, lines) {   // metres from a point to the nearest part of the route
  const kx = Math.cos(lat * Math.PI / 180) * 111320, ky = 110540;
  let best = Infinity;
  for (const line of lines) {
    for (let i = 0; i < line.length - 1; i++) {
      const ax = (line[i][1] - lon) * kx, ay = (line[i][0] - lat) * ky;
      const bx = (line[i + 1][1] - lon) * kx, by = (line[i + 1][0] - lat) * ky;
      const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
      let t = len2 ? -(ax * dx + ay * dy) / len2 : 0; t = Math.max(0, Math.min(1, t));
      best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
    }
  }
  return best;
}
function cumDist(chain) { const c = [0]; for (let i = 1; i < chain.length; i++) c.push(c[i - 1] + havM(chain[i - 1], chain[i])); return c; }
function bearingDeg(a, b) {
  const rad = x => x * Math.PI / 180, dl = rad(b[1] - a[1]);
  const y = Math.sin(dl) * Math.cos(rad(b[0]));
  const x = Math.cos(rad(a[0])) * Math.sin(rad(b[0])) - Math.sin(rad(a[0])) * Math.cos(rad(b[0])) * Math.cos(dl);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function alongRoute(lat, lon, chain, cum) {   // nearest point on the route: metres along it, and metres off it
  const kx = Math.cos(lat * Math.PI / 180) * 111320, ky = 110540;
  let best = {off: Infinity, along: 0};
  for (let i = 0; i < chain.length - 1; i++) {
    const ax = (chain[i][1] - lon) * kx, ay = (chain[i][0] - lat) * ky;
    const bx = (chain[i + 1][1] - lon) * kx, by = (chain[i + 1][0] - lat) * ky;

}

async function togglePanel(r, btn, panel) {
  if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }
  panel.style.display = ''; panel.className = 'gpanel'; panel.onclick = e => e.stopPropagation();
  if (panel.dataset.loaded) return;
  panel.textContent = '';
  // --- my rating and notes
  let rating = r.my_rating || 0;
  const stars = document.createElement('div'); stars.className = 'stars';
  const paint = () => [...stars.children].forEach((s, i) => s.classList.toggle('on', i < rating));
  for (let i = 1; i <= 5; i++) { const sp = document.createElement('span'); sp.textContent = '★'; sp.title = i + ' star(s)'; sp.onclick = () => { rating = (rating === i ? 0 : i); paint(); }; stars.appendChild(sp); }
  paint();
  const ta = document.createElement('textarea'); ta.placeholder = 'My notes: conditions, parking, who I went with…'; ta.value = r.my_note || '';
  const save = document.createElement('button'); save.className = 'b'; save.style.cssText = 'margin-top:4px;padding:4px 12px;font-size:13px'; save.textContent = 'Save my rating & notes';
  const msg = document.createElement('span'); msg.className = 'att'; msg.style.marginLeft = '8px';
  save.onclick = async () => {
    try {
      const resp = await fetch('/api/walks/' + r.osm_id + '/note', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({rating: rating || null, note: ta.value})});
      const j = await resp.json().catch(() => ({})); if (!resp.ok) throw new Error(j.error || 'Save failed');
      r.my_rating = j.my_rating; r.my_note = j.my_note; msg.textContent = 'Saved.';
    } catch (e) { msg.textContent = e.message; }
  };
  panel.append(stars, ta, save, msg);
  // --- photos from Wikimedia Commons
  const photos = document.createElement('div'); photos.textContent = 'Loading photos taken nearby…'; photos.style.marginTop = '8px';
  panel.appendChild(photos);
  try {
    const resp = await fetch('/api/walks/' + r.osm_id + '/photos'); const j = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(j.error || ('Failed (' + resp.status + ')'));
    photos.textContent = '';
    if (!j.photos.length) { photos.textContent = 'No openly licensed photos found along this walk.'; }
    else {
      const row = document.createElement('div'); row.className = 'ph';
      j.photos.forEach(p => {
        const fig = document.createElement('figure');
        const a = document.createElement('a'); a.href = p.page; a.target = '_blank'; a.rel = 'noopener';
        const im = document.createElement('img'); im.loading = 'lazy'; im.src = p.thumb; im.alt = p.caption || p.title;
        a.appendChild(im);
        const cap = document.createElement('figcaption'); cap.textContent = (p.caption ? p.caption + ' · ' : '') + p.by + ' · ' + p.license;
        fig.append(a, cap); row.appendChild(fig);
      });
      photos.appendChild(row);
      const at = document.createElement('div'); at.className = 'att'; at.textContent = 'Photos taken near this walk, from Wikimedia Commons (open licences). They may not show the exact track. Click a photo for the original and its licence.'; photos.appendChild(at);
    }
  } catch (e) { photos.textContent = e.message; }
  panel.dataset.loaded = '1';
}

async function del(id) {
  if (!confirm('Remove this walk from your box?')) return;
  await fetch('/api/walks/' + id, {method:'DELETE'}); loadBox();
}

// ---- Rendering ----
function render(keep) {
  if (!keep) clearSelection();
  const list = $('list'); list.textContent = '';
  layerGroup.clearLayers(); lines = {};
  const all = [];
  results.forEach(r => {
    const item = document.createElement('div'); item.className = 'item'; item.id = 'w' + r.osm_id;
    if (mode === 'find' && !r.added) {
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = selected.has(r.osm_id);
      cb.onclick = e => { e.stopPropagation(); cb.checked ? selected.add(r.osm_id) : selected.delete(r.osm_id); };
      item.appendChild(cb);
    }
    const body = document.createElement('div'); body.style.flex = '1';
    const t = document.createElement('div'); t.className = 't'; t.textContent = r.name;
    if (r.added && mode === 'find') { const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = 'in box'; t.appendChild(bd); }
    const m = document.createElement('div'); m.className = 'm';
    m.textContent = [r.distance_km != null ? (r.approx ? '~' : '') + r.distance_km.toFixed(1) + ' km' : null, r.route_type, r.time_text, r.ascent_m ? ('↑ ' + Math.round(r.ascent_m) + ' m') : null, r.region || r.place].filter(Boolean).join(' · ');
    body.append(t, m);
    const chips = document.createElement('div');
    const chip = (txt, cls) => { const c = document.createElement('span'); c.className = 'chip' + (cls ? ' ' + cls : ''); c.textContent = txt; chips.appendChild(c); };
    if (r.difficulty) chip(r.difficulty);
    chip(r.source_label);
    if (r.ref) chip('ref ' + r.ref);
    body.appendChild(chips);
    if (r.my_rating) chip('My rating: ' + '★'.repeat(r.my_rating));
    if (mode === 'box') {
      const gb = document.createElement('button'); gb.className = 'b alt'; gb.style.cssText = 'margin-top:6px;padding:4px 10px;font-size:13px';
      gb.textContent = 'Photos & my notes';
      const panel = document.createElement('div'); panel.style.display = 'none';
      gb.onclick = e => { e.stopPropagation(); togglePanel(r, gb, panel); };
      body.append(gb, panel);
    }
    { const at = document.createElement('a'); at.href = 'https://www.alltrails.com/search?q=' + encodeURIComponent(r.name + (r.region ? ' ' + r.region : '')); at.target = '_blank'; at.rel = 'noopener'; at.textContent = 'Find on AllTrails ↗'; at.style.cssText = 'font-size:13px;margin-left:10px'; at.onclick = e => e.stopPropagation(); body.appendChild(at); }
    if (r.line && r.line.length && r.line[0].length > 1) body.appendChild(makeNav(r));
    if (!r.line) { const hint = document.createElement('div'); hint.className = 'm'; hint.style.fontStyle = 'italic'; hint.textContent = 'Click to load the route, elevation, weather and nearby places.'; body.appendChild(hint); }
    if (r.link) { const a = document.createElement('a'); a.href = r.link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'More info'; a.style.fontSize = '13px'; a.onclick = e => e.stopPropagation(); body.appendChild(a); }
    if (r.description) { const d = document.createElement('div'); d.className = 'd'; d.textContent = r.description.slice(0, 160); body.appendChild(d); }
    item.appendChild(body);
    if (r.added) {
      const acts = document.createElement('div'); acts.className = 'acts';
      const a = document.createElement('a'); a.className = 'dl'; a.href = '/walks/' + r.osm_id + '.gpx' + (r.reversed ? '?reverse=1' : ''); a.textContent = 'Download GPX';
      a.onclick = e => e.stopPropagation(); acts.appendChild(a);
      if (mode === 'box') { const b = document.createElement('button'); b.className = 'del'; b.textContent = 'Remove'; b.onclick = e => { e.stopPropagation(); del(r.osm_id); }; acts.appendChild(b); }
      item.appendChild(acts);
    }
    item.onclick = () => openWalk(r.osm_id);
    list.appendChild(item);
    if (r.line && r.line.length) {
      const pl = L.polyline(r.line, {color: r.added ? '#2f6f4f' : '#d2691e', weight: 4, opacity: .8})
        .bindTooltip(r.name).on('click', () => openWalk(r.osm_id)).addTo(layerGroup);
      lines[r.osm_id] = pl; all.push(pl);
    }
  });
  if (mode === 'box' && all.length) map.fitBounds(L.featureGroup(all).getBounds(), {padding:[30,30], maxZoom: 14});
  if (keep && sel) { const el = $('w' + sel.r.osm_id); if (el) el.classList.add('sel'); if (lines[sel.r.osm_id]) lines[sel.r.osm_id].setStyle({opacity: 0}); }
}
function reverseWalk(id) {              // walk the same route the other way round
  const r = results.find(x => x.osm_id == id); if (!r || !r.line) return;
  r.line = r.line.map(c => c.slice().reverse()); r.reversed = !r.reversed;
  render();                                // rebuilds cards, links and lines for the new direction
  focus(id);
}
$('revbtn').onclick = () => { if (sel) reverseWalk(sel.r.osm_id); };
const loadingIds = new Set();
async function openWalk(id) {          // routes are fetched only when a walk is clicked
  const r = results.find(x => x.osm_id == id); if (!r) return;
  if (!r.line) {
    if (loadingIds.has(id)) return;
    loadingIds.add(id);
    const el = $('w' + id); if (el) el.style.opacity = .55;
    status('Loading the route for “' + r.name + '”…');
    try { Object.assign(r, await post('/api/detail', {id})); status('Loaded “' + r.name + '”.'); }
    catch (e) { status(e.message, true); loadingIds.delete(id); if (el) el.style.opacity = ''; return; }
    loadingIds.delete(id);
    if (!results.includes(r)) return;     // the list changed while loading
    render();
  }
  focus(id);
}
function focus(id) {
  document.querySelectorAll('.item').forEach(e => e.classList.remove('sel'));
  const el = $('w' + id); if (el) { el.classList.add('sel'); el.scrollIntoView({block:'nearest'}); }
  Object.entries(lines).forEach(([k, l]) => l.setStyle({weight: k == id ? 7 : 4}));
  if (lines[id]) { lines[id].bringToFront(); map.fitBounds(lines[id].getBounds(), {padding:[30,30]}); }
  const r = results.find(x => x.osm_id == id); if (r) selectWalk(r);
}

// ---- Start with the map on the current location; fall back to Auckland CBD. No automatic search. ----
(function startLocation() {
  const hint = ' Press “Find walks in this map view” to search.';
  if (!navigator.geolocation) { status('Location is not available in this browser. Showing Auckland CBD.' + hint); return; }
  navigator.geolocation.getCurrentPosition(
    pos => { map.setView([pos.coords.latitude, pos.coords.longitude], 13, {animate: false}); status('Showing your current location.' + hint); },
    () => status('Could not get your location. Showing Auckland CBD.' + hint),
    {enableHighAccuracy: false, timeout: 8000, maximumAge: 600000}
  );
})();
</script>
