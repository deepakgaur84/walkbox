services:
  walkbox:
    # Image is built automatically by GitHub Actions on every push to main.
    image: ghcr.io/deepakgaur84/walkbox:latest
    container_name: walkbox
    volumes:
      # Holds walkbox.db. Must exist before deploy.
      - /volume1/docker/walkbox/data:/data
    environment:
      DB_PATH: /data/walkbox.db
      MAX_SPAN_DEG: "0.5"
      MAX_RESULTS: "150"
      # Turn-by-turn routing engine below (container name and internal port).
      VALHALLA_URL: http://walkbox-valhalla:8002
    # Public DNS so the container can reach the OpenStreetMap servers.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - proxynet
    restart: unless-stopped

  walkbox-valhalla:
    # Free self-hosted walking routing for New Zealand. First start downloads the NZ map
    # and builds routing tiles, which takes a while; watch the container log.
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: walkbox-valhalla
    volumes:
      # Holds the downloaded map and built routing tiles. Must exist before deploy.
      - /volume1/docker/walkbox/valhalla:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/australia-oceania/new-zealand-latest.osm.pbf
      server_threads: "2"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - proxynet
    restart: unless-stopped

networks:
  proxynet:
    external: true
    name: proxynet
